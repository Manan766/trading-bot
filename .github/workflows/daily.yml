name: Trading Bot Monitor

# Schedule removed - cron-job.org will trigger this via API
# This is more reliable than GitHub's built-in schedule (which has 30+ min delays)
on:
  workflow_dispatch:
    inputs:
      task:
        description: 'Which task to run'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - morning
          - monitor
          - closing
          - test

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install libraries
        run: pip install yfinance pandas numpy requests feedparser

      - name: Run trading bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST_MODE: "true"
          BUDGET: "2000"
          # PORTFOLIO: "SBIN,IDEA,PNB"
        run: |
          if [ "${{ github.event.inputs.task }}" = "auto" ] || [ -z "${{ github.event.inputs.task }}" ]; then
            python trading_bot.py
          else
            python trading_bot.py ${{ github.event.inputs.task }}
          fi
